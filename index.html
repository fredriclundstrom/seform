<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seform</title>
<meta name="description" content="Seform">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-320 -320 640 640'%3E%3Crect x='-320' y='-320' width='640' height='640' fill='%230a0a0c'/%3E%3Cpath d='M-300 0A375 375 0 0 1 300 0A375 375 0 0 1-300 0Z' fill='%23fff'/%3E%3Ccircle r='124' fill='%232244b8'/%3E%3Ccircle r='62' fill='%231e1c1c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Knewave&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0a0c;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Ögat ligger i en kvadrat (1000 x 1000 enheter) som skalas efter fönstrets
     kortaste sida och står mitt i fönstret. Det svarta fortsätter utanför. */
  #scen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    font-family: "Space Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
  }

  /* Hälsningen. Med mus: centrerad i nederkant under ögat. De två meningarna står på
     en rad när bredden räcker, annars bryts raden mellan dem (aldrig mitt i en mening). */
  #halsning {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(5vmin, env(safe-area-inset-bottom));
    margin: 0;
    padding: 0 max(5vmin, env(safe-area-inset-right)) 0 max(5vmin, env(safe-area-inset-left));
    color: #ffffff;
    font: 400 clamp(14px, 2.7vmin, 28px)/1.5 Knewave, "Marker Felt", "Comic Sans MS", cursive;
    text-align: center;
    pointer-events: none;
  }
  #halsning span { display: inline-block; white-space: nowrap; }

  /* Pekskärm (mobil, surfplatta): texten ligger uppe till vänster och vänsterställd.
     Där får den mer luft, och den krockar inte med webbläsarens knappar i nederkant. */
  @media (hover: none), (pointer: coarse) {
    #halsning {
      top: max(5vmin, env(safe-area-inset-top));
      bottom: auto;
      text-align: left;
    }
  }
  /* Låg liggande skärm (mobil på tvären): där når ögat nästan ut till över- och
     underkant, så texten hålls i vänstra hörnet på två rader för att gå fri. */
  @media (orientation: landscape) and (max-height: 480px) {
    #halsning {
      right: auto;
      width: 44vw;
      text-align: left;
    }
  }

  /* Iris är kontaktknappen. Med mus visas orden och pilen först när man pekar
     på den. På pekskärm står de där hela tiden. */
  #iris { cursor: pointer; outline: none; }
  #iris:focus-visible > circle:first-child { stroke: #ffffff; stroke-width: 4; }
  #iris:active { opacity: .85; }
  .ring, .pil, .glans { transition: opacity .2s ease; }
  .mus .ring, .mus .pil { opacity: 0; }
  .mus #iris.visa .ring, .mus #iris.visa .pil { opacity: 1; }
  .mus #iris.visa .glans { opacity: 0; }

  /* Egen muspekare: en pil som alltid pekar in mot ögat och knuffar lite åt det hållet.
     Blandningsläget gör den synlig på både ljus och mörk botten. */
  #pekare {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 10;
    width: 40px;
    height: 40px;
    margin: -20px 0 0 -20px;
    color: #ffffff;
    mix-blend-mode: difference;
    pointer-events: none;
    display: none;
  }
  .har-pekare #pekare { display: block; }
  .har-pekare, .har-pekare * { cursor: none !important; }
  #pekare.gomd { opacity: 0; }
  #pekare .riktning { width: 100%; height: 100%; }
  #pekare svg {
    display: block;
    width: 100%;
    height: 100%;
    animation: mot-ogat 1.1s ease-in-out infinite;
  }
  @keyframes mot-ogat {
    0%, 100% { transform: translateX(-3px); }
    50% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #pekare svg { animation: none; }
  }
</style>
</head>
<body>

<svg id="scen" viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>

<p id="halsning"><span>Nothing to see here.</span> <span>Feel free to say hello.</span></p>

<div id="pekare" aria-hidden="true"><div class="riktning"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20 H32"/><path d="M22 10 L32 20 L22 30"/></svg></div></div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const KOBOLT = '#2244b8', VIT = '#ffffff', SVART = '#1e1c1c';
  const lugn = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const harMus = matchMedia('(hover: hover) and (pointer: fine)');
  const scen = document.getElementById('scen');
  const pekarbild = document.getElementById('pekare');
  const riktning = pekarbild.querySelector('.riktning');

  // Två utseenden. Med mus: avlångt öga som följer pekaren, och knappen visas när
  // man pekar på iris. På pekskärm: rundare öga med stor iris som står helt stilla
  // och alltid visar knappen. Måtten är i enheter där 1000 = skärmens kortaste sida.
  const MUS = { w: 300, h: 150, iris: 124, pupill: 62 };
  const PEK = { w: 460, h: 360, iris: 290, pupill: 115 };

  const VILA_MS = 3000; // så länge efter senaste rörelsen fortsätter ögat titta på pekaren

  let oga, ogonlock, iris, pupill, ring, matt; // delar av det öga som visas just nu
  let pekare = null;
  let senastRorelse = -Infinity;
  let vandring = null, nastaVandring = 0;
  let hovrar = false;
  let x = 0, y = 0, blink = 1, blinkMal = 1;

  function el(namn, attr, foralder) {
    const e = document.createElementNS(NS, namn);
    for (const k in attr) e.setAttribute(k, attr[k]);
    if (foralder) foralder.appendChild(e);
    return e;
  }

  // --- Bygg ögat ---------------------------------------------------------------

  function bygg() {
    matt = harMus.matches ? MUS : PEK;
    const { w, h, iris: ri, pupill: rp } = matt;
    scen.replaceChildren();
    scen.classList.toggle('mus', harMus.matches);
    if (!harMus.matches) document.documentElement.classList.remove('har-pekare');
    hovrar = false; x = y = 0;

    // Ögats form: en mandel av två cirkelbågar.
    const R = (w * w + h * h) / (2 * h);
    const form = `M${-w} 0 A${R} ${R} 0 0 1 ${w} 0 A${R} ${R} 0 0 1 ${-w} 0Z`;
    el('rect', { x: -5000, y: -5000, width: 10000, height: 10000, fill: '#0a0a0c' }, scen);
    oga = el('g', {}, scen);
    // Ögonvitan ritas som en vanlig fylld form, och iris skärs till med en mask i
    // stället för en klippbana. Masker får mjuka kanter, klippbanor blir taggiga.
    const mask = el('mask', { id: 'ogonform', maskUnits: 'userSpaceOnUse', x: -w, y: -h, width: 2 * w, height: 2 * h }, oga);
    el('path', { d: form, fill: '#ffffff' }, mask);
    ogonlock = el('g', {}, oga);
    el('path', { d: form, fill: VIT }, ogonlock);
    const inre = el('g', { mask: 'url(#ogonform)' }, ogonlock);

    iris = el('g', { id: 'iris', role: 'button', tabindex: 0, 'aria-label': 'Skicka mejl till Seform' }, inre);
    el('circle', { r: ri, fill: KOBOLT }, iris);

    // "KONTAKT" tre gånger runt iris med en punkt mittemellan varje ord. Textstorleken
    // begränsas av både bandets höjd och omkretsen, så att orden får luft emellan sig.
    const band = ri - rp;
    const grad = Math.min(band * 0.36, (rp + band / 2) * 0.25);
    const bas = rp + band / 2 - grad * 0.35;
    el('path', { id: 'ringbana', d: `M${-bas} 0 a${bas} ${bas} 0 1 1 ${2 * bas} 0 a${bas} ${bas} 0 1 1 ${-2 * bas} 0` }, el('defs', {}, iris));
    ring = el('g', { class: 'ring', fill: VIT, 'font-size': grad, 'letter-spacing': grad * 0.24,
                     'text-anchor': 'middle', 'aria-hidden': 'true' }, iris);
    for (let k = 0; k < 3; k++) {
      const ord = el('text', { transform: `rotate(${k * 120})` }, ring);
      el('textPath', { href: '#ringbana', startOffset: '25%' }, ord).textContent = 'KONTAKT';
      el('circle', { cy: -(bas + grad * 0.35), r: grad * 0.12, transform: `rotate(${60 + k * 120})` }, ring);
    }

    // Pupillen: reflex i vila (bara med mus), annars pilen snett uppåt höger.
    pupill = el('g', {}, iris);
    el('circle', { r: rp, fill: SVART }, pupill);
    if (harMus.matches) el('circle', { class: 'glans', cx: -rp * 0.42, cy: -rp * 0.45, r: rp * 0.28, fill: VIT }, pupill);
    const a = rp * 0.36;
    el('path', { class: 'pil', d: `M${-a} ${a} L${a} ${-a} M${-a * 0.45} ${-a} H${a} V${a * 0.45}`, fill: 'none', stroke: VIT,
                 'stroke-width': a * 0.32, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, pupill);

    iris.addEventListener('click', mejla);
    iris.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); mejla(); }
    });
    iris.addEventListener('pointerenter', e => {
      if (e.pointerType !== 'mouse') return;
      hovrar = true;
      pekarbild.classList.add('gomd');
      uppdatera();
    });
    iris.addEventListener('pointerleave', () => {
      hovrar = false;
      pekarbild.classList.remove('gomd');
      uppdatera();
    });
    iris.addEventListener('focus', uppdatera);
    iris.addEventListener('blur', uppdatera);
  }

  const uppdatera = () => iris.classList.toggle('visa', hovrar || iris.matches(':focus-visible'));

  // --- Kontakt -----------------------------------------------------------------

  // Adressen finns inte i klartext någonstans i filen, och ingen mejllänk ligger i
  // sidan. Den ligger som en omräknad sifferrad och räknas fram först när någon
  // faktiskt klickar. Då öppnas besökarens mejlprogram med adressen ifylld.
  const KOD = [67, 88, 66, 68, 91, 81, 76, 108, 94, 73, 77, 85, 99, 85, 25, 101, 80];
  const adress = () => String.fromCharCode(...KOD.map((n, i) => (n - i) ^ 37));
  const mejla = () => { location.href = ['mail', 'to:'].join('') + adress(); };

  // --- Blicken (bara med mus) -----------------------------------------------------

  // Dit ögat ska titta just nu: pekaren om den nyss rört sig, annars en punkt som
  // flyttar sig lite då och då så att ögat ser sig omkring.
  function blickpunkt(nu) {
    if (pekare && (hovrar || nu - senastRorelse < VILA_MS)) return pekare;
    if (lugn) return pekare;
    if (nu > nastaVandring) {
      vandring = { x: innerWidth * (0.1 + 0.8 * Math.random()), y: innerHeight * (0.15 + 0.7 * Math.random()) };
      nastaVandring = nu + 1200 + Math.random() * 2400;
    }
    return vandring;
  }

  function bildruta(nu) {
    if (harMus.matches) {
      const RX = (matt.w - matt.iris) * 0.62, RY = matt.h - matt.iris, RACKA = matt.w * 1.3;
      const blick = blickpunkt(nu);
      const m = blick && oga.getScreenCTM();
      let malX = 0, malY = 0;
      if (m) {
        const p = new DOMPoint(blick.x, blick.y).matrixTransform(m.inverse());
        const d = Math.hypot(p.x, p.y) || 1;
        const k = Math.min(1, d / RACKA);
        malX = (p.x / d) * RX * k;
        malY = (p.y / d) * RY * k;
      }
      x += (malX - x) * 0.12;
      y += (malY - y) * 0.12;
      blink += (blinkMal - blink) * 0.35;
      iris.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
      pupill.setAttribute('transform', `translate(${(x * 0.14).toFixed(2)} ${(y * 0.5).toFixed(2)})`);
      ogonlock.setAttribute('transform', `scale(1 ${blink.toFixed(3)})`);
      if (!lugn) ring.setAttribute('transform', `rotate(${((nu * 0.03) % 360).toFixed(2)})`);
    }
    requestAnimationFrame(bildruta);
  }

  function blinka() {
    if (harMus.matches) {
      blinkMal = 0.04;
      setTimeout(() => { blinkMal = 1; }, 130);
    }
    setTimeout(blinka, 2500 + Math.random() * 4500);
  }

  window.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || !harMus.matches) return;
    pekare = { x: e.clientX, y: e.clientY };
    senastRorelse = performance.now();
    // Muspekaren följer musen och vrids så att pilen pekar mot ögat.
    document.documentElement.classList.add('har-pekare');
    pekarbild.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    const m = oga.getScreenCTM();
    const vinkel = Math.atan2(m.f - e.clientY, m.e - e.clientX) * 180 / Math.PI;
    riktning.style.transform = `rotate(${vinkel.toFixed(1)}deg)`;
  });
  document.addEventListener('pointerleave', () => document.documentElement.classList.remove('har-pekare'));

  // --- Start ---------------------------------------------------------------------

  bygg();
  harMus.addEventListener('change', bygg); // t.ex. när en mus kopplas till en surfplatta
  requestAnimationFrame(bildruta);
  if (!lugn) setTimeout(blinka, 1800);
})();
</script>
</body>
</html>
